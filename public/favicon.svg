<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Glow & Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0909"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flameOuter" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="35%" stop-color="#dc2626"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Badge Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Ambient Glow -->
  <circle cx="32" cy="36" r="16" fill="#ef4444" opacity="0.3"/>

  <!-- Stylized Token Burn Flame Icon -->
  <g filter="url(#flameGlow)">
    <!-- Outer Dynamic Flame -->
    <path d="M32 9 C32 9, 36.5 17.5, 42 22 C47.5 26.5, 50 33, 48 40 C46 47, 39.5 53, 32 53 C24.5 53, 18 47, 16 40 C14 33, 16.5 26.5, 22 22 C27.5 17.5, 32 9, 32 9 Z" fill="url(#flameOuter)"/>

    <!-- Left Accent Tongue -->
    <path d="M24 28 C20 34, 22 43, 27 48 C22 45, 20 39, 24 28 Z" fill="#7f1d1d" opacity="0.6"/>

    <!-- Inner Core Flame -->
    <path d="M32 22 C32 22, 35.5 28.5, 38.5 33 C41.5 37.5, 40.5 43.5, 37.5 46.5 C35.5 48.5, 33.5 49.5, 32 49.5 C30.5 49.5, 28.5 48.5, 26.5 46.5 C23.5 43.5, 22.5 37.5, 25.5 33 C28.5 28.5, 32 22, 32 22 Z" fill="url(#flameInner)"/>

    <!-- White-Hot Center Spark -->
    <path d="M32 34 C33.8 37.5, 34.5 40.5, 33.5 43.5 C32.5 45, 31 45, 30.5 43.5 C29.5 40.5, 30.2 37.5, 32 34 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Incised Token Coin Ring -->
  <circle cx="32" cy="37" r="9.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3.5 2" opacity="0.6"/>
</svg>